source: openapi/ (OBIE Read/Write 4.0.1 responses) + Open Banking Read/Write API error-code namespace
format: obie-oberror
note: OBIE Read/Write APIs do NOT use RFC 9457 problem+json. Errors use the OBIE OBErrorResponse1 envelope;
  the high-level Code is an HTTP-status label, and each item in Errors[] carries a UK.OBIE.* ErrorCode
  plus Message/Path/Url. Content is application/json (and application/jose+jwe for JWE-wrapped responses).
envelope:
  schema: OBErrorResponse1
  fields:
    Code: High-level textual error code (typically the HTTP status label).
    Id: Unique reference (often mirrors x-fapi-interaction-id) for support correlation.
    Message: Brief high-level error description.
    Errors: Array of OBError1 { ErrorCode, Message, Path, Url }.
