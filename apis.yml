name: Coutts
kind: company
description: Coutts & Co is a British private bank and wealth manager founded in 1692, headquartered in
  London and serving high-net-worth individuals, families, commercial and institutional clients. It is
  a wholly owned subsidiary of NatWest Group (formerly The Royal Bank of Scotland Group), one of the UK
  CMA9 banking groups mandated to deliver Open Banking. Coutts is authorised by the Prudential Regulation
  Authority and regulated by the Financial Conduct Authority and the PRA (FCA Firm Reference 001b000000MfEueAAF).
  As an Account Servicing Payment Service Provider (ASPSP) it participates in UK Open Banking under PSD2,
  exposing its account, payment and confirmation-of-funds surfaces through NatWest Group's "Bank of APIs"
  developer platform. Those Read/Write APIs conform to the Open Banking Implementation Entity (OBIE) Read/Write
  Standard and are secured with FAPI-grade OAuth2/OIDC, PSD2 strong customer authentication, and mutual-TLS
  client authentication using OBIE/eIDAS certificates. Coutts additionally publishes OBIE Open Data reference
  information for its commercial/business current accounts.
