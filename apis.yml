apis:
- aid: coutts:coutts-account-transaction-api
  name: Coutts Account and Transaction Information API
  description: OBIE Read/Write Account and Transaction Information (AIS) API for Coutts, letting FCA-authorised
    AISPs retrieve account, balance, transaction, party, standing order, direct debit, beneficiary, product
    and statement data with the customer's consent. Conforms to the OBIE Read/Write Standard and is secured
    with FAPI OAuth2/OIDC, mTLS and PSD2 strong customer authentication.
  humanURL: https://www.bankofapis.com/products/coutts-open-banking
  baseURL: https://api.coutts.com/open-banking/v3.1/aisp
  tags:
  - Account Information
  - AIS
  - Open Banking
  properties:
  - type: OpenAPI
    url: openapi/coutts-account-info-openapi.yaml
  - type: Documentation
    url: https://www.bankofapis.com/products/coutts-open-banking
  - type: APIReference
    url: https://www.bankofapis.com/documentation
  - type: Overlay
    url: overlays/coutts-account-info-overlay.yaml
- aid: coutts:coutts-payment-initiation-api
  name: Coutts Payment Initiation API
  description: OBIE Read/Write Payment Initiation (PIS) API for Coutts, letting FCA-authorised PISPs initiate
    domestic, scheduled, standing-order, international and file payments on behalf of the account holder.
    Conforms to the OBIE Read/Write Standard and is secured with FAPI OAuth2/OIDC, mTLS and PSD2 strong
    customer authentication.
  humanURL: https://www.bankofapis.com/products/coutts-open-banking
  baseURL: https://api.coutts.com/open-banking/v3.1/pisp
  tags:
  - Payment Initiation
  - PIS
  - Payments
  properties:
  - type: OpenAPI
    url: openapi/coutts-payment-initiation-openapi.yaml
  - type: Documentation
    url: https://www.bankofapis.com/products/coutts-open-banking
  - type: APIReference
    url: https://www.bankofapis.com/documentation
  - type: Overlay
    url: overlays/coutts-payment-initiation-overlay.yaml
- aid: coutts:coutts-confirmation-of-funds-api
  name: Coutts Confirmation of Funds API
  description: OBIE Read/Write Confirmation of Funds (CBPII) API for Coutts, letting authorised Card Based
    Payment Instrument Issuers check whether sufficient funds are available on an account before a transaction.
    Conforms to the OBIE Read/Write Standard and is secured with FAPI OAuth2/OIDC, mTLS and PSD2 strong
    customer authentication.
  humanURL: https://www.bankofapis.com/products/coutts-open-banking
  baseURL: https://api.coutts.com/open-banking/v3.1/cbpii
  tags:
  - Confirmation of Funds
  - CBPII
  - Open Banking
  properties:
  - type: OpenAPI
    url: openapi/coutts-confirmation-funds-openapi.yaml
  - type: Documentation
    url: https://www.bankofapis.com/products/coutts-open-banking
  - type: APIReference
    url: https://www.bankofapis.com/documentation
  - type: Overlay
    url: overlays/coutts-confirmation-funds-overlay.yaml
- aid: coutts:coutts-open-data-api
  name: Coutts Open Data API
  description: OBIE Open Data API for Coutts publishing PUBLIC, unauthenticated reference data for its
    commercial/business current account products, following the Open Banking Open Data Standard. As a
    private bank Coutts operates no retail ATM or branch network, so it publishes product reference data
    rather than ATM/Branch locator data. Base path shown follows the OBIE Open Data path convention; the
    exact live open-data URL was not confirmed unauthenticated (the api.coutts.com gateway is mutual-TLS
    gated).
  humanURL: https://www.bankofapis.com/products/coutts-open-banking
  baseURL: https://api.coutts.com/open-banking/v2.3/business-current-accounts
  tags:
  - Open Data
  - Business Current Accounts
  - Open Banking
  properties:
