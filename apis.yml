apis:
- aid: coutts:coutts-open-data-api
  name: Coutts Open Data API
  description: >-
    OBIE Open Data API for Coutts publishing PUBLIC, unauthenticated reference data for its commercial/business
    current account products, following the Open Banking Open Data Standard. As a private bank Coutts
    operates no retail ATM or branch network, so it publishes product reference data rather than ATM/Branch
    locator data. Base path shown follows the OBIE Open Data path convention; the exact live open-data
    URL was not confirmed unauthenticated (the api.coutts.com gateway is mutual-TLS gated).
  humanURL: https://www.bankofapis.com/products/coutts-open-banking
  baseURL: https://api.coutts.com/open-banking/v2.3/business-current-accounts
  tags:
  - Open Data
  - Business Current Accounts
  - Open Banking
